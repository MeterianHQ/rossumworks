name: Release

# Builds and publishes a release from a tag v<version>. See the section Release of CONTRIBUTING.md.
on:
  push:
    tags: ['v*']

permissions: {}

# A second push of the same tag waits for the first run.
concurrency:
  group: release-${{ github.ref }}

jobs:
  # A short check before the native build, so that a wrong tag does not use the native runners.
  check-tag:
    name: Check the release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check that the tag matches the version of pom.xml
        run: |
          version=$(./mvnw -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [[ "$version" == *-SNAPSHOT ]]; then
            echo "::error::The version $version is a SNAPSHOT. Make a release commit first. See CONTRIBUTING.md."
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match the project version $version. Use the tag v$version."
            exit 1
          fi

  native:
    name: Build and test the native programs
    needs: check-tag
    uses: ./.github/workflows/native.yml
    permissions:
      contents: read

  release:
    name: Build and publish the release
    needs: [check-tag, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      # The build gets no token: gh reads GH_TOKEN only in the step that publishes.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release notes start at the previous tag, so the checkout needs all the tags.
          fetch-depth: 0
          persist-credentials: false

      - name: Install the JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: ./mvnw -B -ntp verify

      # The last check: the jar and the native programs read the version from this resource.
      - name: Check that the tag matches the version of the build
        id: version
        run: |
          version=$(sed -n 's/^version=//p' target/classes/factory-version.properties)
          if [ -z "$version" ]; then
            echo "::error::The build wrote no version in factory-version.properties."
            exit 1
          fi
          if [[ "$version" == *-SNAPSHOT ]]; then
            echo "::error::The version $version is a SNAPSHOT. Make a release commit first. See CONTRIBUTING.md."
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match the project version $version. Use the tag v$version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The job native keeps the artifacts rossumworks-linux-x64 and rossumworks-linux-arm64.
      - name: Get the native programs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rossumworks-linux-*
          path: ${{ runner.temp }}/native-artifacts

      # run.sh finds the programs by these names, and checks each program with its .sha256 file.
      - name: Prepare the release files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p target/release
          cp "target/rossumworks-$VERSION.jar" target/release/
          for platform in linux-x64 linux-arm64; do
            program="$RUNNER_TEMP/native-artifacts/rossumworks-$platform/rossumworks"
            if [ ! -f "$program" ]; then
              echo "::error::The native program of $platform is missing."
              exit 1
            fi
            cp "$program" "target/release/rossumworks-$VERSION-$platform"
            chmod +x "target/release/rossumworks-$VERSION-$platform"
          done
          cd target/release
          for file in *; do
            sha256sum "$file" > "$file.sha256"
          done
          ls -l

      # The suffix "-" sorts a pre-release before its release, for example 0.6.0-rc.1 before 0.6.0.
      - name: Find the previous release tag
        id: previous
        run: |
          previous=$(git -c versionsort.suffix=- tag --list 'v*' --sort=-v:refname \
            | grep -x -A1 -F "$GITHUB_REF_NAME" | sed -n 2p)
          echo "tag=$previous" >> "$GITHUB_OUTPUT"

      # A version with a suffix, for example 0.6.0-rc.1, is a pre-release.
      - name: Publish the release
        working-directory: target/release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
        run: |
          # A rerun keeps a published release. It deletes a draft from a stopped upload. The tag stays.
          prepare_release() {
            local error_file state
            error_file="$(mktemp)"
            if state=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>"$error_file"); then
              if [ "$state" = false ]; then
                echo "::notice::The release $GITHUB_REF_NAME exists already."
                exit 0
              fi
              gh release delete "$GITHUB_REF_NAME" --yes
            elif ! grep --quiet --ignore-case "release not found" "$error_file"; then
              echo "::error::The check of the release $GITHUB_REF_NAME failed: $(tr '\n' ' ' < "$error_file")"
              exit 1
            fi
          }
          prepare_release
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          notes_start=()
          if [ -n "$PREVIOUS_TAG" ]; then
            notes_start=(--notes-start-tag "$PREVIOUS_TAG")
          fi
          gh release create "$GITHUB_REF_NAME" "${prerelease[@]}" "${notes_start[@]}" --verify-tag --generate-notes \
            --title "RossumWorks $VERSION" ./*
