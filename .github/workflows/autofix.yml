name: Autofix

on:
  workflow_dispatch:
  schedule:
    # Each day at 07:00. On Monday this is one hour after the scan.
    - cron: "0 7 * * *"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: autofix
  cancel-in-progress: false

jobs:
  autofix:
    name: Fix the dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The pull request uses github.token. GitHub does not start other
      # workflows for it, so close and reopen the pull request to run Build.
      - name: Fix the dependencies and open a pull request
        uses: MeterianHQ/meterian-github-action@4ca1db711dfb80dab40a700fc448d7695ba22127 # v1.0.19
        env:
          METERIAN_API_TOKEN: ${{ secrets.METERIAN_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          autofix_security: conservative
          autofix_stability: safe
          autofix_with_pr: true
