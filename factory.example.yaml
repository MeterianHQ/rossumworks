# create writes this file for you: java -jar claude-ai-factory.jar create
repository: MeterianHQ/heidi-fix
work-directory: /home/bbossola/.claude-ai-factory/work
gatekeeper-directory: /home/bbossola/.claude-ai-factory/gatekeeper.git
# live-directory: /path/to/live         # optional, default: <work-directory>/live
limits:                 # all keys optional
  parallel-issues: 2
  poll-interval: 60s
  usage-threshold: 0.90
build:                  # optional: the variables of this machine; a value here replaces the value of .factory
  environment:
    JAVA_HOME: /home/bbossola/.sdkman/candidates/java/21.0.2-open
isolation:              # optional
  mode: same-user
claude:                 # optional
  command: claude
  disallowed-tools: ["Bash(git push*)", "Bash(gh *)", WebFetch, WebSearch]
# live:                 # optional
#   terminal-command: [gnome-terminal, --]   # the worker adds the tmux attach command at the end
# web:                  # optional; without it the worker serves no page
#   address: 127.0.0.1  # optional; 0.0.0.0 opens the page to the LAN
#   port: 8090          # optional
#   password-hash: "pbkdf2-sha256:600000:..."   # optional; make it with hash-password; without it the page has no login
